name: Enforce dev → main

on:
  pull_request:
    branches: [main]

jobs:
  check-source-branch:
    runs-on: ubuntu-latest
    steps:
      - name: Solo se permite mergear desde dev
        if: github.head_ref != 'dev'
        run: |
          echo "::error::Los PRs hacia main solo pueden venir de 'dev' (este viene de '${{ github.head_ref }}')."
          exit 1
